# Deploy the Vite client from this monorepo.
# In Netlify UI you can leave Base/Publish empty — this file sets them.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# SPA fallback so React Router routes don't 404 / blank on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
