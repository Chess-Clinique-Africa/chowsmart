services:
  db:
    image: postgres:16-alpine
    container_name: chowsmart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chowsmart
      POSTGRES_PASSWORD: chowsmart
      POSTGRES_DB: chowsmart
    ports:
      - "5432:5432"
    volumes:
      - chowsmart_pg:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  chowsmart_pg:
